<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <style>
      .primary-stroke {
        stroke: #D4AF37;
        stroke-width: 1.25;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        opacity: 0.35;
      }
      .secondary-stroke {
        stroke: #D4AF37;
        stroke-width: 0.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        opacity: 0.22;
      }
      .fine-grid {
        stroke: #1B4D3E;
        stroke-width: 0.5;
        fill: none;
        opacity: 0.4;
      }
      .star-fill {
        fill: #D4AF37;
        fill-opacity: 0.035;
      }
      .core-fill {
        fill: #0F382A;
        fill-opacity: 0.5;
      }
    </style>
  </defs>

  <!-- Structural Framework Grid -->
  <line x1="0" y1="0" x2="120" y2="120" class="fine-grid" />
  <line x1="120" y1="0" x2="0" y2="120" class="fine-grid" />
  <line x1="60" y1="0" x2="60" y2="120" class="fine-grid" />
  <line x1="0" y1="60" x2="120" y2="60" class="fine-grid" />

  <!-- Diagonal Octagonal Interlaced Connectors -->
  <!-- Top <-> Center -->
  <line x1="60" y1="0" x2="40.5153941376" y2="19.4846058624" class="secondary-stroke" />
  <line x1="60" y1="0" x2="79.4846058624" y2="19.4846058624" class="secondary-stroke" />
  <!-- Bottom <-> Center -->
  <line x1="60" y1="120" x2="40.5153941376" y2="100.5153941376" class="secondary-stroke" />
  <line x1="60" y1="120" x2="79.4846058624" y2="100.5153941376" class="secondary-stroke" />
  <!-- Left <-> Center -->
  <line x1="0" y1="60" x2="19.4846058624" y2="40.5153941376" class="secondary-stroke" />
  <line x1="0" y1="60" x2="19.4846058624" y2="79.4846058624" class="secondary-stroke" />
  <!-- Right <-> Center -->
  <line x1="120" y1="60" x2="100.5153941376" y2="40.5153941376" class="secondary-stroke" />
  <line x1="120" y1="60" x2="100.5153941376" y2="79.4846058624" class="secondary-stroke" />

  <!-- Center Star Shamsa -->
  <polygon points="60.00,26.40 65.33,47.14 83.76,36.24 72.86,54.67 93.60,60.00 72.86,65.33 83.76,83.76 65.33,72.86 60.00,93.60 54.67,72.86 36.24,83.76 47.14,65.33 26.40,60.00 47.14,54.67 36.24,36.24 54.67,47.14" class="primary-stroke star-fill" />
  <polygon points="60.00,38.16 63.46,51.64 75.44,44.56 68.36,56.54 81.84,60.00 68.36,63.46 75.44,75.44 63.46,68.36 60.00,81.84 56.54,68.36 44.56,75.44 51.64,63.46 38.16,60.00 51.64,56.54 44.56,44.56 56.54,51.64" class="secondary-stroke core-fill" />
  <circle cx="60" cy="60" r="10.438181712" class="secondary-stroke" />
  <circle cx="60" cy="60" r="2" fill="#D4AF37" fill-opacity="0.4" />

  <!-- Corner Quarter Stars -->
  <polygon points="0.00,-33.60 5.33,-12.86 23.76,-23.76 12.86,-5.33 33.60,0.00 12.86,5.33 23.76,23.76 5.33,12.86 0.00,33.60 -5.33,12.86 -23.76,23.76 -12.86,5.33 -33.60,0.00 -12.86,-5.33 -23.76,-23.76 -5.33,-12.86" class="primary-stroke star-fill" />
  <polygon points="120.00,-33.60 125.33,-12.86 143.76,-23.76 132.86,-5.33 153.60,0.00 132.86,5.33 143.76,23.76 125.33,12.86 120.00,33.60 114.67,12.86 96.24,23.76 107.14,5.33 86.40,0.00 107.14,-5.33 96.24,-23.76 114.67,-12.86" class="primary-stroke star-fill" />
  <polygon points="0.00,86.40 5.33,107.14 23.76,96.24 12.86,114.67 33.60,120.00 12.86,125.33 23.76,143.76 5.33,132.86 0.00,153.60 -5.33,132.86 -23.76,143.76 -12.86,125.33 -33.60,120.00 -12.86,114.67 -23.76,96.24 -5.33,107.14" class="primary-stroke star-fill" />
  <polygon points="120.00,86.40 125.33,107.14 143.76,96.24 132.86,114.67 153.60,120.00 132.86,125.33 143.76,143.76 125.33,132.86 120.00,153.60 114.67,132.86 96.24,143.76 107.14,125.33 86.40,120.00 107.14,114.67 96.24,96.24 114.67,107.14" class="primary-stroke star-fill" />

  <!-- Diamond & Octagram Petals -->
  <rect x="48" y="48" width="24" height="24" transform="rotate(45 60 60)" class="secondary-stroke" />
  <rect x="48" y="48" width="24" height="24" class="secondary-stroke" />
</svg>